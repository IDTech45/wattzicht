# Lokaal draaien zonder Dokploy/Traefik:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# API op http://localhost:8080 (Swagger: /swagger), website op http://localhost:8081, Postgres op 5432.
services:
  postgres:
    ports:
      - "5432:5432"
  api:
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - internal
  frontend:
    ports:
      - "8081:80"
    networks:
      - internal

networks:
  dokploy-network:
    external: false
