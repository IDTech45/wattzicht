name: tests

on:
  push:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build API
        run: dotnet build src/Wattzicht.Api/Wattzicht.Api.csproj -c Release
      - name: Test
        run: dotnet test tests/Wattzicht.Api.Tests/Wattzicht.Api.Tests.csproj -c Release --logger "console;verbosity=normal"

  app-android:
    # Controleert dat de MAUI-app voor Android compileert (inclusief Firebase-push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android
        # Alleen Android: iOS kan niet op Linux. De runner heeft de Android-SDK al.
        run: >
          dotnet build src/Wattzicht.App/Wattzicht.App.csproj -c Debug
          -p:TargetFrameworks=net9.0-android
          -p:AcceptAndroidSDKLicenses=true
