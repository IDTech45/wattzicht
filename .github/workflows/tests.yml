name: tests

on:
  push:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build API
        run: dotnet build src/Wattzicht.Api/Wattzicht.Api.csproj -c Release
      - name: Test
        run: dotnet test tests/Wattzicht.Api.Tests/Wattzicht.Api.Tests.csproj -c Release --logger "console;verbosity=normal"

  api-docker:
    # Zelfde build als Dokploy bij elke deploy: draait alle tests in de image-build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (met tests)
        run: docker build -f src/Wattzicht.Api/Dockerfile -t wattzicht-api:ci .

  app-colors:
    # Kleurregels van de app: geen kleurcodes buiten Colors.xaml, en elke opgevraagde sleutel bestaat.
    # Die tweede is de reden dat dit in CI staat: een StaticResource die niet bestaat valt in MAUI pas
    # op als dat scherm opengaat, dus een typefout in een kleurnaam komt er anders doorheen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kleurcontrole
        run: ./scripts/check-app-colors.sh

  app-android:
    # Controleert dat de MAUI-app voor Android compileert (inclusief Firebase-push).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build Android
        # Alleen Android: iOS kan niet op Linux. De runner heeft de Android-SDK al.
        run: >
          dotnet build src/Wattzicht.App/Wattzicht.App.csproj -c Debug
          -p:AndroidOnly=true
          -p:AcceptAndroidSDKLicenses=true

  web:
    # Controleert dat de website (Vue + TypeScript) bouwt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
