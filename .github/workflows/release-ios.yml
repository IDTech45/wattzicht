name: release-ios

# Bouwt de iPhone-app op een macOS-machine van GitHub en zet hem in TestFlight.
#
# Waarom dit bestaat: Xcode draait niet op Windows, en zonder Xcode geen .ipa. GitHub verhuurt echte
# Macs met Xcode erop, dus hoeft er geen Mac op het bureau te staan. Dezelfde dotnet-opdracht die je
# lokaal zou geven, draait daar.
#
# Kosten: macOS-minuten tellen tienvoudig mee. Deze build duurt een kwartier, dus reken op ongeveer
# anderhalf uur van je maandtegoed per keer. Daarom start hij NIET vanzelf bij elke push: met de hand
# starten of met een tag ios-v*.
#
# Benodigde geheimen (Settings -> Secrets and variables -> Actions):
#   IOS_DIST_CERT_P12         het distributiecertificaat als .p12, base64-gecodeerd
#   IOS_DIST_CERT_PASSWORD    het wachtwoord van dat .p12-bestand
#   IOS_PROVISIONING_PROFILE  het App Store-provisioningprofiel (.mobileprovision), base64
#   APPLE_TEAM_ID             het team-id uit developer.apple.com (tien tekens)
#   APPSTORE_API_KEY_ID       sleutel-id van de App Store Connect API-sleutel
#   APPSTORE_API_ISSUER_ID    issuer-id van diezelfde sleutel
#   APPSTORE_API_PRIVATE_KEY  de inhoud van het .p8-bestand, inclusief BEGIN- en END-regels
#
# Base64 maken (Git Bash):  base64 -w0 dist.p12   en   base64 -w0 wattzicht.mobileprovision
#
# Anders dan bij een Capacitor-app ondertekent MAUI tijdens het publiceren zelf. Daarom staat hier
# geen -allowProvisioningUpdates: het profiel moet er echt zijn. Dat is eenmalig werk in
# developer.apple.com en daarna jaren geldig, met één verlenging per jaar.
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60

    # Of de geheimen er zijn, bepalen we HIER. Een stap mag in zijn "if" niet bij secrets; schrijf je
    # dat toch, dan keurt GitHub het hele bestand af en krijg je een mislukte run zonder één stap.
    env:
      HEEFT_CERT: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
      HEEFT_API: ${{ secrets.APPSTORE_API_KEY_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: MAUI iOS-workload
        run: dotnet workload install maui-ios

      # Apple weigert pakketten die met een oudere SDK zijn gebouwd. De machine heeft meerdere
      # Xcode-versies naast elkaar en de standaard loopt achter, dus kiezen we expliciet de nieuwste.
      - name: De nieuwste Xcode kiezen
        run: |
          NIEUWSTE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NIEUWSTE/Contents/Developer"
          xcodebuild -version

      # Het certificaat gaat in een eigen sleutelbos en niet in de login-sleutelbos. Zo blijft er na
      # de build niets achter, en de machine wordt sowieso weggegooid.
      - name: Certificaat en profiel klaarzetten
        if: env.HEEFT_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Zonder deze regel vraagt codesign halverwege om toestemming en blijft de build hangen.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm $RUNNER_TEMP/dist.p12

          # Xcode en MAUI zoeken profielen alleen op deze ene plek, op naam van hun UUID.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/profiel.mobileprovision
          UUID=$(security cms -D -i $RUNNER_TEMP/profiel.mobileprovision \
                 | plutil -extract UUID raw -o - -)
          NAAM=$(security cms -D -i $RUNNER_TEMP/profiel.mobileprovision \
                 | plutil -extract Name raw -o - -)
          cp $RUNNER_TEMP/profiel.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFIEL_NAAM=$NAAM" >> $GITHUB_ENV
          echo "Profiel geplaatst: $NAAM"

      - name: App Store Connect-sleutel klaarzetten
        if: env.HEEFT_API == 'true'
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY" > ~/private_keys/AuthKey_$API_KEY_ID.p8

      # Buildnummer = runnummer, zodat elke upload hoger is dan de vorige. App Store Connect weigert
      # een build waarvan het nummer al bestaat, ook als de inhoud anders is.
      - name: Bouwen en ondertekenen
        if: env.HEEFT_CERT == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          dotnet publish src/Wattzicht.App/Wattzicht.App.csproj -c Release -f net9.0-ios
          -p:ApplicationVersion=${{ github.run_number }}
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFIEL_NAAM"
          -o out

      # Het .ipa bewaren ook als het uploaden mislukt. Dan hoef je niet opnieuw te bouwen en weer
      # Mac-minuten te verbranden om erachter te komen wat er mis ging.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wattzicht-ios-ipa
          path: out/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Naar TestFlight sturen
        if: env.HEEFT_CERT == 'true' && env.HEEFT_API == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(ls out/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Wat er nog mist
        if: env.HEEFT_CERT != 'true' || env.HEEFT_API != 'true'
        run: |
          echo "::warning::Niet gebouwd of niet geupload: de geheimen ontbreken nog."
          echo "Zie de uitleg bovenin .github/workflows/release-ios.yml en docs/STORES-RELEASE.md."
