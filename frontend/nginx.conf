# Eén adres is het echte adres. De .com en de www-varianten sturen door naar https://wattzicht.nl,
# zodat zoekmachines niet drie keer dezelfde site zien en een link altijd op dezelfde plek uitkomt.
# 301 en niet 302: dit is blijvend, en alleen dan nemen zoekmachines het over.
server {
    listen 80;
    server_name wattzicht.com www.wattzicht.com www.wattzicht.nl;
    return 301 https://wattzicht.nl$request_uri;
}

server {
    # Uitdrukkelijk de standaardserver. Zonder dit is het éérste server-blok de standaard, en dat is
    # sinds het doorsturen hierboven het omleidingsblok: toen kreeg elk verzoek zonder passende
    # servernaam een 301 naar wattzicht.nl, ook de gezondheidscontrole van de container zelf. De site
    # stond daardoor een kwartier op 404 (04-11-2026).
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API naar onze eigen .NET-container. Bewust de containernaam "wattzicht-api" en niet de
    # servicenaam "api": alle projecten op deze VPS hangen aan hetzelfde dokploy-network, en LaadCash
    # heeft daar ook een service "api". Die naam bestaat dus twee keer en Docker's DNS wisselt ertussen.
    # Daar kwam de 502 van: nginx had het IP van de verkeerde container onthouden en die kreeg bij een
    # LaadCash-deploy een nieuw IP. Het adres staat daarom in een variabele met de Docker-resolver
    # erbij, zodat nginx elke 10 seconden opnieuw opzoekt in plaats van één keer bij het opstarten.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $wattzicht_api wattzicht-api:8080;
        # Zonder pad achter proxy_pass gaat het oorspronkelijke verzoek-URI onveranderd door, dus
        # /api/health komt als /api/health binnen. Precies wat de API verwacht.
        proxy_pass http://$wattzicht_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Gehashte assets lang cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-fallback.
    #
    # Let op twee dingen die samen een vervelende fout gaven. Met "$uri/" stuurt nginx /installateurs
    # eerst met een 301 naar /installateurs/, en omdat hij die omleiding absoluut opbouwt deed hij dat
    # met http:// erin, terwijl Traefik er https voor had. Elke voorgebakken pagina kostte zo een
    # extra stap en viel heel even terug naar onbeveiligd. Daarom meteen het index.html van die map
    # serveren, en omleidingen relatief houden.
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
