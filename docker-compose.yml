# Wattzicht – productie-compose voor Dokploy op de Leaseweb-VPS (zelfde opzet als LaadCash).
# Secrets komen uit .env.production (maak die met scripts/generate-secrets.sh) en plak je in
# Dokploy → Environment. Domeinen hang je in Dokploy → Domains aan de services; Dokploy's Traefik
# regelt HTTPS. De containers luisteren daarom alleen op localhost (nooit direct op internet).
#
# Poorten verschillen bewust van LaadCash (8080/8081), zodat beide op dezelfde VPS kunnen draaien:
#   api       127.0.0.1:8090 → container 8080
#   frontend  127.0.0.1:8091 → container 80

services:
  postgres:
    image: postgres:16
    container_name: wattzicht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattzicht}
      POSTGRES_USER: ${POSTGRES_USER:-wattzicht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      TZ: Europe/Amsterdam
    volumes:
      - wattzicht-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattzicht} -d ${POSTGRES_DB:-wattzicht}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Wattzicht.Api/Dockerfile
    container_name: wattzicht-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wattzicht};Username=${POSTGRES_USER:-wattzicht};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt}
      WZ_PROTECTION_KEY: ${WZ_PROTECTION_KEY:?WZ_PROTECTION_KEY ontbreekt}
      # De website praat via nginx (/api) met de API, dus CORS is alleen nodig voor losse clients.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-https://wattzicht.nl}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-https://www.wattzicht.nl}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__InstallerPassword: ${SEED_INSTALLER_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      TZ: Europe/Amsterdam
    ports:
      - "127.0.0.1:8090:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wattzicht-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8091:80"

volumes:
  wattzicht-postgres-data:
