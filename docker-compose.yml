# Wattzicht – productie-compose voor Dokploy op de Leaseweb-VPS (zelfde opzet als LaadCash).
# Secrets komen uit .env.production (maak die met scripts/generate-secrets.sh) en plak je in
# Dokploy → Environment. Domeinen hang je in Dokploy → Domains aan de services; Dokploy's Traefik
# regelt HTTPS en bereikt api en frontend via het externe netwerk "dokploy-network"; er worden geen
# host-poorten gepubliceerd (geen conflicten met LaadCash of andere apps op dezelfde VPS).

services:
  postgres:
    image: postgres:16
    container_name: wattzicht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattzicht}
      POSTGRES_USER: ${POSTGRES_USER:-wattzicht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      TZ: Europe/Amsterdam
    volumes:
      - wattzicht-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattzicht} -d ${POSTGRES_DB:-wattzicht}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Wattzicht.Api/Dockerfile
    container_name: wattzicht-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wattzicht};Username=${POSTGRES_USER:-wattzicht};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt}
      WZ_PROTECTION_KEY: ${WZ_PROTECTION_KEY:?WZ_PROTECTION_KEY ontbreekt}
      # De website praat via nginx (/api) met de API, dus CORS is alleen nodig voor losse clients.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-https://wattzicht.nl}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-https://www.wattzicht.nl}
      # De .com stuurt door naar de .nl, maar staat er toch bij: een app of koppeling die nog het oude
      # adres gebruikt moet niet stilvallen op een CORS-fout waar niemand iets van ziet.
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2:-https://wattzicht.com}
      Cors__AllowedOrigins__3: ${CORS_ORIGIN_3:-https://wattzicht.laadcash.nl}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__AdminAccount: ${SEED_ADMIN_ACCOUNT:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__InstallerPassword: ${SEED_INSTALLER_PASSWORD:-}
      # Demo-woning met een gesimuleerde dagcurve: alleen voor demonstreren, standaard uit.
      Seed__Demo: ${SEED_DEMO:-false}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Enphase (micro-omvormers). Zonder deze drie staat Enphase-koppelen uit met een duidelijke melding.
      Connectors__Enphase__ClientId: ${ENPHASE_CLIENT_ID:-}
      Connectors__Enphase__ClientSecret: ${ENPHASE_CLIENT_SECRET:-}
      Connectors__Enphase__ApiKey: ${ENPHASE_API_KEY:-}

      # Plus. Staat uit tot 1 januari 2027; de abonnementen worden intussen wel bijgehouden.
      Plus__Enabled: ${PLUS_ENABLED:-false}

      # Aankopen controleren bij de stores. Zonder deze waarden kan er niets gekocht worden; zie
      # docs/STORES.md. Liever niemand Plus dan iemand Plus op een bonnetje dat niet nagekeken is.
      Store__Apple__KeyId: ${STORE_APPLE_KEY_ID:-}
      Store__Apple__IssuerId: ${STORE_APPLE_ISSUER_ID:-}
      Store__Apple__BundleId: ${STORE_APPLE_BUNDLE_ID:-nl.wattzicht.app}
      Store__Apple__PrivateKeyPem: ${STORE_APPLE_PRIVATE_KEY_PEM:-}
      Store__Apple__BaseUrl: ${STORE_APPLE_BASE_URL:-https://api.storekit.itunes.apple.com}
      Store__Google__PackageName: ${STORE_GOOGLE_PACKAGE_NAME:-nl.wattzicht.app}
      Store__Google__ServiceAccountFile: /run/secrets/wattzicht/play.json

      # LaadCash: waar de aanmeldlink heen gaat en het geheim waarmee LaadCash terugmeldt dat een
      # woning zich heeft aangemeld. Zonder geheim staat dat endpoint dicht.
      Laadcash__RegisterUrl: ${LAADCASH_REGISTER_URL:-https://laadcash.nl/register}
      Laadcash__SharedSecret: ${LAADCASH_SHARED_SECRET:-}
      # Waar we de geladen kilowatturen ophalen bij LaadCash.
      Laadcash__ApiBase: ${LAADCASH_API_BASE:-https://api.laadcash.nl}

      # Post. Zonder MAIL_HOST verstuurt de server niets en logt hij alleen; dan komt er dus ook
      # geen bevestigingsmail aan en blijft elk nieuw account onbevestigd staan.
      Mail__Host: ${MAIL_HOST:-}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__User: ${MAIL_USER:-}
      Mail__Password: ${MAIL_PASSWORD:-}
      Mail__From: ${MAIL_FROM:-noreply@wattzicht.nl}
      Mail__FromName: ${MAIL_FROM_NAME:-Wattzicht}
      Mail__StartTls: ${MAIL_STARTTLS:-true}

      TZ: Europe/Amsterdam
      # Pushmeldingen: eigen Firebase-project 'wattzicht'. De servicesleutel staat als bestand op de server
      # en wordt alleen-lezen ingehangen: niet in de repo, niet in een env-variabele. Zonder bestand: push uit.
      Push__Fcm__ProjectId: ${FCM_PROJECT_ID:-wattzicht}
      Push__Fcm__ServiceAccountFile: /run/secrets/wattzicht/fcm.json
    volumes:
      # De sleutel komt uit een Dokploy "File Mount" (app → Advanced → Mounts, pad: fcm/fcm.json).
      # Dokploy zet die bestanden in ../files naast de code. Een map i.p.v. los bestand: zolang de
      # sleutel ontbreekt, is de map leeg en staat push gewoon uit.
      - ../files/fcm:/run/secrets/wattzicht:ro
    expose:
      - "8080"
    networks:
      - dokploy-network
    # Traefik-routers staan hier in plaats van in het Dokploy-scherm, zodat de adressen in de repo
    # staan en een nieuwe server ze meekrijgt. Dokploy zet zijn eigen routers er bij deploy naast;
    # die hebben andere namen en bijten elkaar niet.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.wz-api-web.rule=Host(`api.wattzicht.nl`)
      - traefik.http.routers.wz-api-web.entrypoints=web
      - traefik.http.routers.wz-api-web.middlewares=redirect-to-https@file
      - traefik.http.routers.wz-api-web.service=wz-api
      - traefik.http.routers.wz-api-websecure.rule=Host(`api.wattzicht.nl`)
      - traefik.http.routers.wz-api-websecure.entrypoints=websecure
      - traefik.http.routers.wz-api-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.wz-api-websecure.service=wz-api
      - traefik.http.services.wz-api.loadbalancer.server.port=8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wattzicht-frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - dokploy-network
    # Alle vier de adressen komen hier binnen; nginx stuurt .com en de www-varianten door naar
    # https://wattzicht.nl. Let's Encrypt geeft per hostnaam een certificaat, dus ook de adressen die
    # alleen doorsturen hebben er een nodig.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.wz-site-web.rule=Host(`wattzicht.nl`) || Host(`www.wattzicht.nl`) || Host(`wattzicht.com`) || Host(`www.wattzicht.com`)
      - traefik.http.routers.wz-site-web.entrypoints=web
      - traefik.http.routers.wz-site-web.middlewares=redirect-to-https@file
      - traefik.http.routers.wz-site-web.service=wz-site
      - traefik.http.routers.wz-site-websecure.rule=Host(`wattzicht.nl`) || Host(`www.wattzicht.nl`) || Host(`wattzicht.com`) || Host(`www.wattzicht.com`)
      - traefik.http.routers.wz-site-websecure.entrypoints=websecure
      - traefik.http.routers.wz-site-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.wz-site-websecure.service=wz-site
      - traefik.http.services.wz-site.loadbalancer.server.port=80

  # Nachtelijke database-backup (pg_dump) met upload naar S3-compatibele opslag BUITEN de server.
  # Zelfde recept als LaadCash, want het probleem is hetzelfde: valt deze VPS om, dan is zonder
  # kopie buiten de deur alles weg wat bewoners hier hebben opgebouwd, en dat is niet te herstellen.
  # Zonder BACKUP_S3_*-variabelen draait hij lokaal (dumps in het backups-volume) en waarschuwt hij
  # in de logs; dat is beter dan niets maar helpt niet bij een crash van de server zelf.
  backup:
    build:
      context: ./scripts/backup
    container_name: wattzicht-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-wattzicht}
      PGUSER: ${POSTGRES_USER:-wattzicht}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      TZ: ${BACKUP_TZ:-Europe/Amsterdam}
      # Niet om 03:30 zoals LaadCash: die twee zouden anders tegelijk dumpen op dezelfde server.
      BACKUP_TIME: ${BACKUP_TIME:-04:15}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-3}
      # Versleutel dumps vóór upload. Zonder passphrase geen herstel, dus bewaar hem in je
      # wachtwoordmanager en niet alleen in Dokploy.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # BACKUP_S3_PATH = "bucket/prefix", bijvoorbeeld "wattzicht-backups/db". Leeg = alleen lokaal.
      BACKUP_S3_PATH: ${BACKUP_S3_PATH:-}
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_S3_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      RCLONE_CONFIG_S3_ACL: private
      # Ping-URL (healthchecks.io) na elke geslaagde backup: zo krijg je juist een alarm als de
      # backup stilvalt, want een backup die niet draait meldt zichzelf nooit.
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - wattzicht-backups:/backups
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  wattzicht-postgres-data:
  wattzicht-backups:

# Eén netwerk voor alles: Traefik kiest anders soms het IP van het verkeerde netwerk (503).
# Postgres publiceert geen poort en is alleen voor containers op dit netwerk bereikbaar.
networks:
  dokploy-network:
    external: true
