# Wattzicht – productie-compose voor Dokploy op de Leaseweb-VPS (zelfde opzet als LaadCash).
# Secrets komen uit .env.production (maak die met scripts/generate-secrets.sh) en plak je in
# Dokploy → Environment. Domeinen hang je in Dokploy → Domains aan de services; Dokploy's Traefik
# regelt HTTPS en bereikt api en frontend via het externe netwerk "dokploy-network"; er worden geen
# host-poorten gepubliceerd (geen conflicten met LaadCash of andere apps op dezelfde VPS).

services:
  postgres:
    image: postgres:16
    container_name: wattzicht-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattzicht}
      POSTGRES_USER: ${POSTGRES_USER:-wattzicht}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      TZ: Europe/Amsterdam
    volumes:
      - wattzicht-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattzicht} -d ${POSTGRES_DB:-wattzicht}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Wattzicht.Api/Dockerfile
    container_name: wattzicht-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wattzicht};Username=${POSTGRES_USER:-wattzicht};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt}
      WZ_PROTECTION_KEY: ${WZ_PROTECTION_KEY:?WZ_PROTECTION_KEY ontbreekt}
      # De website praat via nginx (/api) met de API, dus CORS is alleen nodig voor losse clients.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-https://wattzicht.nl}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-https://www.wattzicht.nl}
      Seed__Enabled: ${SEED_ENABLED:-true}
      Seed__InstallerPassword: ${SEED_INSTALLER_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      TZ: Europe/Amsterdam
      # Pushmeldingen: eigen Firebase-project 'wattzicht'. De servicesleutel staat als bestand op de server
      # en wordt alleen-lezen ingehangen: niet in de repo, niet in een env-variabele. Zonder bestand: push uit.
      Push__Fcm__ProjectId: ${FCM_PROJECT_ID:-wattzicht}
      Push__Fcm__ServiceAccountFile: /run/secrets/wattzicht/fcm.json
    volumes:
      # De sleutel komt uit een Dokploy "File Mount" (app → Advanced → Mounts, pad: fcm/fcm.json).
      # Dokploy zet die bestanden in ../files naast de code. Een map i.p.v. los bestand: zolang de
      # sleutel ontbreekt, is de map leeg en staat push gewoon uit.
      - ../files/fcm:/run/secrets/wattzicht:ro
    expose:
      - "8080"
    networks:
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wattzicht-frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - dokploy-network

volumes:
  wattzicht-postgres-data:

# Eén netwerk voor alles: Traefik kiest anders soms het IP van het verkeerde netwerk (503).
# Postgres publiceert geen poort en is alleen voor containers op dit netwerk bereikbaar.
networks:
  dokploy-network:
    external: true
